[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krxdrag"
version = "0.1.0"
description = "Cross-sectional variance-drag screener for Korean listed equities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JaeHyun Park" }]
keywords = ["quantitative-finance", "krx", "ito", "volatility-drag", "gbm"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pyarrow>=14.0",
    "lxml>=4.9",
    "html5lib>=1.1",
    "tabulate>=0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
krx = ["pykrx>=1.0.45"]

[project.scripts]
krxdrag = "krxdrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
